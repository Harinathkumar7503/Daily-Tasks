<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Quiz App</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
    #quiz-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 400px; }
    .question { font-weight: bold; margin-bottom: 10px; }
    .choices button { display: block; margin: 5px 0; padding: 10px; width: 100%; cursor: pointer; }
    #next-btn { margin-top: 15px; padding: 10px 20px; cursor: pointer; }
    #result { font-size: 18px; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="quiz-container">
    <div id="quiz"></div>
    <button id="next-btn">Next</button>
    <div id="result"></div>
  </div>

  <script>
    const quizData = [
      { question: "What is 2 + 2?", choices: ["3", "4", "5", "6"], answer: "4" },
      { question: "Which language runs in the browser?", choices: ["Java", "C", "Python", "JavaScript"], answer: "JavaScript" },
      { question: "What does CSS stand for?", choices: ["Cascading Style Sheets", "Colorful Style Sheets", "Computer Style Sheets", "Creative Style Sheets"], answer: "Cascading Style Sheets" },
      { question: "Which HTML tag is used for a paragraph?", choices: ["<p>", "<h1>", "<div>", "<span>"], answer: "<p>" }
    ];

    let currentQuestion = 0;
    let score = 0;

    const quizContainer = document.getElementById("quiz");
    const resultContainer = document.getElementById("result");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion() {
      if(currentQuestion >= quizData.length){
        quizContainer.innerHTML = "";
        nextBtn.style.display = "none";
        resultContainer.innerHTML = `Your score: ${score} / ${quizData.length}`;
        return;
      }

      const q = quizData[currentQuestion];
      quizContainer.innerHTML = `<div class="question">${q.question}</div>
        <div class="choices">
          ${q.choices.map(choice => `<button onclick="checkAnswer('${choice}')">${choice}</button>`).join('')}
        </div>`;
    }

    function checkAnswer(choice) {
      if(choice === quizData[currentQuestion].answer){
        score++;
      }
      currentQuestion++;
      loadQuestion();
    }

    nextBtn.addEventListener("click", loadQuestion);

    loadQuestion();
  </script>
</body>
</html>
