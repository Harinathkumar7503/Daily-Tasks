<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex {
            padding: 50px 30px 50px 30px;
            background-color: black;
            justify-content: center;
            align-items: center;
            margin: 100px;
            border-radius: 20px;
            /* height: 500px; */

        }

        .row1,
        .row2 {
            display: flex;
            gap: 30px;
        }

        .col-1 {
            background-color: crimson;
            width: 40%;
            padding: 40px;
        }

        .col-2 {
            background-color: rgb(173, 220, 20);
            width: 60%;
            padding: 40px;
        }


        .row2,
        .row3,
        .row4 {
            margin-top: 20px;
        }

        .r2Col-1 {
            background-color: rgb(155, 19, 233);
            width: 60%;
            padding: 40px;
        }

        .r2Col-2 {
            background-color: crimson;
            width: 40%;
            padding: 40px;
        }

        .r3Col-1 {
            background-color: green;
            padding: 40px;
        }

        .r4Col-1 {
            background-color: blue;
            padding: 40px;
        }

        .grid {
            padding: 50px 30px 50px 30px;
            background-color: black;
            justify-content: center;
            align-items: center;
            margin: 300px;
            border-radius: 20px;
            height: 430px;
            margin-top: 100px;
        }

        .grow1 {
            display: grid;
            gap: 30px;
            grid-template-columns: 1fr 1fr;
        }

        .gr1Col-1 {
           background-color: black;
          
        }

        .col-11 {
            background-color: rgb(236, 8, 8);
            padding: 40px;
            height: 0px;
        }

        .gr1Col-2 {

            background-color: black;


        }

        .col-21 {
            background-color: rgb(175, 236, 8);
            padding: 40px;
            height: 120px;
        }



        .r2c1{
            display: grid;
            grid-template-columns: 1fr 1fr;
           margin-top: 20px;

        }
        .c1{
             background-color: green;
            padding: 20px;
            width: 80px;
            height: 280px;
        }
        .c2{
             background-color: blue;
            padding: 20px;
            width: 80px;
            margin-left: 50px;
            height: 160px; 
        }
        .col-22{
              background-color: red;
            padding: 40px;
            margin-top: 20px;
        }
        .gr3Col-3{
           background-color: rgb(130, 4, 150);
            padding: 40px; 
            margin-left: 180px;
            bottom:80px;
            z-index: 2;
            position: relative;
        }
       h2{
        align-items: center;
        font-size: 30px;
        color: blueviolet;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-style: italic;
        text-decoration: underline;
        text-decoration-color: brown;
       }
    </style>
</head>

<body>

    <h2>Flex Example: </h2>
    <div class="flex">
        <div class="row1">
            <div class="col-1">
            </div>
            <div class="col-2">
            </div>
        </div>

        <div class="row2">
            <div class="r2Col-1"></div>
            <div class="r2Col-2"></div>
        </div>


        <div class="row3">
            <div class="r3Col-1">
            </div>
        </div>

        <div class="row4">
            <div class="r4Col-1"></div>
        </div>
    </div>



    <h2>Grid Example:</h2>
    <div class="grid">

        <div class="grow1">

            <div class="gr1Col-1">
                <div class="col-11"></div>
                 <div class="r2c1">
                    <div class="c1"></div>
                    <div class="c2"></div>
                 </div>

            </div>



            <div class="gr1Col-2">
                <div class="col-21"></div>
                <div class="col-22"></div>

            </div>
           


        </div>
         <div class="gr3Col-3"></div>

    </div>

</body>

</html>
