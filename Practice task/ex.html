<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial;
}

.product {
  width: 250px;
  text-align: center;
}

.img-box {
  overflow: hidden;
}

.img-box img {
  width: 100%;
  transition: transform 0.4s ease;
}

.product:hover img {
  transform: scale(1.1);
}

.price {
  margin: 10px 0;
  transition: transform 0.3s ease;
}

.cart {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s ease;
  background: black;
  color: white;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
}

.product:hover .price {
  transform: translateY(-10px);
}

.product:hover .cart {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="product">
  <div class="img-box">
    <img src="Source/image1.png">
  </div>
  <p class="price">$65.00</p>
  <button class="cart">Add to Cart</button>
</div>

</body>
</html>
