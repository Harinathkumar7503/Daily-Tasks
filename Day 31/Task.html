    <div class="Todolist">

        <input type="text" id="text" placeholder="exnter">

       <button onclick="Decrese()">-</button>
        </div>
    </div>



<div class="Show">

 <h2>Sow / Hide password</h2>

 <input type="text " id="show" placeholder="Enter password">

 <button onclick="showfunction()">Show</button> 
 <button onclick="hidefunction()">Hide</button>


</div>
