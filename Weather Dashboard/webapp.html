<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Marcellus&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-image: url(Sources/watherBg.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: "Poppins", sans-serif;
        }


        .Main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 50px;

        }

        .weather-app {
            width: 80%;

            padding: 30px 25px;
            border-radius: 16px;
            text-align: center;
            color: orangered;
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            line-height: 2em;
        }

         header{
            display: flex;
            align-items: center;
            justify-content: center;
         }
        h2 {
            font-size: 28px;
            color: orangered;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 27%;
            border-bottom:2px solid #0303f4;

        }


        input {
            width: 60%;
            padding: 14px 16px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 15px;
            color: #333;
              background: rgba(255,255,255,0.95);
            animation: Border 10s ease-in 0.2s infinite;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        input::placeholder {
            color: orangered;
            font-family: "Poppins", sans-serif;
        }

        button {
            padding: 15px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff7a18, #ffb347);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 122, 24, 0.5);
            transition: all 0.3s ease;
        }

        button:hover {
            color: #000000;
        }

        @keyframes Border {
            0% {
                border: 2px solid rgb(249, 186, 10);
            }

            20% {
                border: 2px solid green;
            }

            40% {
                border: 2px solid rgb(8, 223, 208);
            }

            60% {
                border: 2px solid rgb(8, 94, 223);
            }

            80% {
                border: 2px solid rgb(216, 8, 223);
            }

            100% {
                border: 2px solid rgb(5, 5, 5);
            }
        }



        .result {
            margin-top: 50px;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }



        .temp {
            font-size: 44px;
            font-weight: 600;
            margin: 10px 0;
        }


        .result p {
            margin: 6px 0;
            font-size: 14px;
            color: #fff;
        }

        input:focus {
            border-color: #ff7a18;
            box-shadow: 0 0 10px rgba(255, 122, 24, 0.6);
        }

        .data {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            animation: Up 0.6s ease;
        }

        @keyframes Up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>Weather Dashboard</h2>
    </header>
    <main>
        <section class="Main">
            <div class="weather-app">
                <input id="city" placeholder="Enter Heare">
                <button onclick="getWeather()">Search</button>
            </div>
        </section>

        <div class="result" id="result"></div>

    </main>


    <script>
        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            if (!city) {
                alert("Enter city name");
                return;
            }

            try {

                const geoRes = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${city}`
                );
                const geoData = await geoRes.json();

                if (!geoData.results) {
                    document.getElementById("result").innerHTML = "City not found ";
                    return;
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                const weatherRes = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
                );
                const weatherData = await weatherRes.json();

                const temp = weatherData.current_weather.temperature;
                const wind = weatherData.current_weather.windspeed;

                document.getElementById("result").innerHTML = `
      <h3>${name}, ${country}</h3>
      <div class="data">
      <h2 class="temp">${temp}°C</h2>
      <p>Wind Speed: ${wind} km/h</p>
      </div>
      
    `;
            }
            catch (err) {
                document.getElementById("result").innerHTML = "Error fetching data";
                console.log(err);
            }
        }
    </script>

</body>

</html>
