<!DOCTYPE html>
<html>
<head>
    <title>Fruit Filter Example</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        h2 { text-align: center; }

        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            background: #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        button.active {
            background: #4f46e5;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Fruit Filter Example (Same Logic as Your Website)</h2>

    <!-- Filter Buttons -->
    <div class="buttons">
        <button onclick="filterFruits('all')" class="active">All</button>
        <button onclick="filterFruits('Frontend')">Frontend</button>
        <button onclick="filterFruits('Backend')">Backend</button>
    </div>

    <!-- Display Cards -->
    <div id="fruit-grid" class="grid">
        <!-- Cards will appear here -->
    </div>

    <script>
        // 🔥 Fruits DATA (same model as your course data)
        const fruits = [
            { name: "Apple", category: "Frontend" },
            { name: "Banana", category: "Backend" },
            { name: "Mango", category: "Frontend" },
            { name: "Grapes", category: "Backend" },
            { name: "Orange", category: "Backend" }
        ];

        // 🔥 MAIN FUNCTION (same as renderCourses)
        function renderFruits(filterCategory = "all") {

            const grid = document.getElementById("fruit-grid");
            grid.innerHTML = ""; // remove old cards

            fruits.forEach(fruit => {

                // 🟢 SAME EXACT CONDITION as your webpage
                if (filterCategory === "all" || fruit.category === filterCategory) {

                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                        ${fruit.name}
                        <br>
                        <span style="color: gray; font-size:14px;">${fruit.category}</span>
                    `;

                    grid.appendChild(card);
                }

            });
        }

        // 🔥 Filter Button Logic (same as your code)
        function filterFruits(category) {

            const buttons = document.querySelectorAll("button");
            buttons.forEach(btn => {
                if (btn.innerText === category || (category === 'all' && btn.innerText === 'All')) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            renderFruits(category);
        }

        // Load all on page start
        renderFruits();
    </script>

</body>
</html>
